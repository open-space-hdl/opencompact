name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  simulation-ghdl:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        # vunit_hdl 5.0.0.dev7 is an sdist whose build needs pkg_resources (setuptools < 81)
        run: |
          python -m pip install "setuptools<81" wheel "setuptools_scm>=8"
          python -m pip install --no-build-isolation -r requirements.txt
      - name: Set up GHDL
        uses: ghdl/setup-ghdl@v1
        with:
          version: latest
          backend: mcode
      - name: Run regression
        run: python run.py -p 4 --xunit-xml results.xml
      - name: Memories of the GHDL netlists against the resource estimate
        run: python lint/memory_check.py
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vunit-results
          path: results.xml

  linting:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Python packages
        # vunit_hdl 5.0.0.dev7 is an sdist whose build needs pkg_resources (setuptools < 81)
        run: |
          python -m pip install "setuptools<81" wheel "setuptools_scm>=8"
          python -m pip install --no-build-isolation -r requirements.txt
      - name: VHDL lint (VSG)
        run: python lint/lint.py
      - name: Low-entropy code tables up to date
        run: python tools/gen_low_entropy_pkg.py --check
      - name: CCSDS traceability
        run: python tools/compliance.py --check
      - name: Register map up to date
        run: python tools/regmap.py --check
      - name: Expected status register words up to date
        run: python tools/ocp_mib_words.py --check
      - name: Decoder of the reference model, memories of the resource estimate
        run: python -m pytest -q tools/tests
      - name: Resource models are the fit of the calibration data
        run: python tools/ocp_estimate_fit.py --check
      - name: Golden data of the JavaScript models up to date
        run: python tools/ocp_estimate_golden.py --check
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript models against the Python models
        run: node --test "tools/tests/*.test.mjs"
      - name: Type check of the JavaScript models (TypeScript 7.0.2, checkJs strict)
        run: npx --yes -p typescript@7.0.2 tsc -p tools/tests/tsconfig.json
      - name: Compile order up to date
        run: |
          python run.py --compile-order
          git diff --exit-code compile_order.txt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint.json
          globs: |
            *.md
            docs/**/*.md
            hdl/**/*.md
